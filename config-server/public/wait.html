<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launching chat page…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #101418;
    color: #eef4f8;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 16px;
    min-height: 100vh;
  }
  .spinner {
    box-sizing: border-box;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid rgba(148, 163, 184, 0.25);
    border-top-color: #66c2ff;
    animation: wait-spin 0.8s linear infinite !important;
  }
  @keyframes wait-spin {
    to { transform: rotate(360deg); }
  }
  .text { font-size: 0.9rem; color: #9fb0bd; }
  .hint { font-size: 0.75rem; color: #5c6773; }
  .hint a { color: #66c2ff; }
</style>
</head>
<body>
  <div class="spinner" role="status" aria-live="polite"></div>
  <div class="text" id="waitText">Launching chat page, please wait…</div>
  <div class="hint" id="waitHint">Gateway is starting up. If it takes too long, <a id="manualLink" href="http://127.0.0.1:18789/#token=aipddclaw&session=agent%3Amain%3Amain">open manually</a></div>
  <script>
    // Bilingual text (shared language preference with the setup page, default English)
    (function () {
      var lang = "en";
      try { lang = localStorage.getItem("aipdd-lang") || "en"; } catch (e) {}
      if (lang === "zh") {
        document.title = "正在启动聊天页面…";
        document.getElementById("waitText").textContent = "正在启动聊天页面，请稍候…";
        document.getElementById("waitHint").innerHTML = "Gateway 正在启动。若长时间无反应，<a href=\"http://127.0.0.1:18789/#token=aipddclaw&session=agent%3Amain%3Amain\">点此手动打开</a>";
      }
    })();
    // Poll the gateway until it answers, then jump straight to the chat page.
    // While the gateway is still booting this page keeps showing the loading
    // style instead of the browser's "can't reach this site" error.
    (function () {
      var GATEWAY = "http://127.0.0.1:18789/";
      var CHAT = "http://127.0.0.1:18789/#token=aipddclaw&session=agent%3Amain%3Amain";
      function check() {
        // mode "no-cors": we only need to know whether the gateway answers at
        // all (any response = up); connection refused rejects the promise.
        fetch(GATEWAY, { mode: "no-cors", cache: "no-store" }).then(
          function () {
            window.location.replace(CHAT);
          },
          function () {}
        );
      }
      check();
      window.setInterval(check, 1000);
    })();
  </script>
</body>
</html>
